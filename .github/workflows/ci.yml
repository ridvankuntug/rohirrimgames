name: CI

# Test gate only. Cloudflare Workers Builds does every deploy (see AGENTS.md, "Static Deployment").
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # The root postinstall runs `npm --prefix frontend ci`; nothing is built here.
      - run: npm ci

      - run: npm test

      - run: npm --prefix frontend run lint

      # `wrangler deploy` runs build.command (node scripts/build-pages-site.mjs)
      # itself, so this step is also the static build: do not add a separate
      # build step. --dry-run bundles worker/index.js (with ../shared/) and
      # checks the Durable Object bindings/exports without credentials.
      - name: Static build and Worker dry run
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dry-run"
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Static site check
        run: npm run check:static
