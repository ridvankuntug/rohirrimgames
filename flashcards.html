<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Vocabulary Flashcards - Rohirrim Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="flashcards.css">
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="deck-library.css" />
    <link rel="stylesheet" href="shared/ai-key-prompt.css" />
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script src="shared/legacy-i18n.js"></script>
    <meta name="theme-color" content="#1c2a1c" />
    <meta name="description" content="Flip through AI-generated vocabulary flashcards with your class." />
    <link rel="canonical" href="https://games.ortadunyaankara.org/flashcards.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rohirrim Game Hub" />
    <meta property="og:url" content="https://games.ortadunyaankara.org/flashcards.html" />
    <meta property="og:title" content="Vocabulary Flashcards - Rohirrim Game Hub" />
    <meta property="og:description" content="Flip through AI-generated vocabulary flashcards with your class." />
    <meta property="og:image" content="https://games.ortadunyaankara.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rohirrim Game Hub" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vocabulary Flashcards - Rohirrim Game Hub" />
    <meta name="twitter:description" content="Flip through AI-generated vocabulary flashcards with your class." />
    <meta name="twitter:image" content="https://games.ortadunyaankara.org/og-image.png" />
</head>

<body>
    <canvas id="particles"></canvas>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="flashcards-stage">
        <header class="game-header">
            <div id="language-selector" class="language-selector-wrap"></div>
            <a href="index.html" class="back-link" data-i18n="legacy.mainMenu">🏠 Main Menu</a>
            <h1 class="page-title" data-i18n="legacy.vocabularyFlashcards">Vocabulary Flashcards</h1>
        </header>

        <section class="board-surface glass-panel">
            <section id="static-deck-wrap" class="deck-library" hidden>
                <div class="deck-library__row">
                    <label><span data-i18n="legacy.deck">Deck</span><select id="static-deck-select"></select></label>
                </div>
            </section>

            <div class="solo-controls glass-panel">
                <div class="solo-top-row">
                    <div id="ai-generate-wrap" style="display:contents">
                        <input type="text" id="theme-input" class="theme-input" placeholder="AI Topic (e.g. Kitchen Items, B1 Idioms, Travel)..." data-i18n-placeholder="legacy.aiTopic" />
                        <button id="btn-generate-ai" class="btn-primary" data-i18n="legacy.aiGenerate">✨ AI Generate</button>
                    </div>
                    <button id="btn-use-default" class="btn-secondary" data-i18n="legacy.defaultDeck">▶️ Default Deck</button>
                    <button id="btn-review-mode" class="btn-secondary btn-review-mode" title="Study only cards marked for review" hidden>🔁 Review Mode (0)</button>
                </div>
                <div id="deck-library-mount"></div>
            </div>

            <div class="stats-row">
                <span id="card-counter" class="stat-badge">Card 1 / 10</span>
                <span id="mastered-counter" class="stat-badge mastered-badge">✅ Mastered: 0</span>
                <span id="review-counter" class="stat-badge review-badge">❌ Review: 0</span>
            </div>

            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <!-- 3D Flip Card Scene -->
            <div class="card-scene">
                <div id="flashcard" class="flashcard">
                    <div class="card-face card-front">
                        <div class="card-header-row">
                            <span class="card-side-label" data-i18n="legacy.englishWord">ENGLISH WORD</span>
                            <button id="btn-pronounce" class="btn-pronounce" title="Listen to pronunciation">🔊</button>
                        </div>
                        <div class="card-body">
                            <h2 id="card-word" class="card-text">EGG</h2>
                        </div>
                        <span class="flip-hint">💡 Click or press Space to Flip</span>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-header-row">
                            <span class="card-side-label" data-i18n="legacy.turkishMeaning">TURKISH MEANING</span>
                        </div>
                        <div class="card-body">
                            <h2 id="card-meaning" class="card-text">YUMURTA</h2>
                        </div>
                        <span class="flip-hint">💡 Click or press Space to Flip Back</span>
                    </div>
                </div>
            </div>

            <div class="card-actions-bar">
                <button id="btn-prev" class="action-btn btn-nav" title="Previous Card (Left Arrow)" data-i18n="legacy.previous">⬅️ Previous</button>
                <button id="btn-mark-review" class="action-btn btn-mark-review" title="Mark for review (R)" data-i18n="legacy.needsReview">❌ Needs Review</button>
                <button id="btn-flip" class="action-btn btn-flip-card" title="Flip Card (Space)" data-i18n="legacy.flip">🔄 Flip Card</button>
                <button id="btn-mark-mastered" class="action-btn btn-mark-mastered" title="Mark mastered (M)" data-i18n="legacy.mastered">✅ Mastered</button>
                <button id="btn-next" class="action-btn btn-nav" title="Next Card (Right Arrow)" data-i18n="legacy.next">Next ➡️</button>
            </div>

            <p id="status-banner" class="status-banner glass-panel">Welcome! Flip the card to study, or generate custom decks with AI above.</p>
        </section>
    </main>

    <script src="particles.js"></script>
    <script src="shared/generation-console.js"></script>
    <script src="shared/feature-flags.js"></script>
    <script src="platform-client.js"></script>
    <script src="shared/ai-key-prompt.js"></script>
    <script src="flashcards.js"></script>
</body>

</html>
