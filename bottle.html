<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Spin the Bottle – OpenClassTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="bottle.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <meta name="theme-color" content="#1c2a1c" />
    <meta name="description" content="Spin the bottle to pick a student and draw a speaking prompt - a classroom icebreaker." />
    <link rel="canonical" href="https://play.metrix.dpdns.org/bottle.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenClassTools" />
    <meta property="og:url" content="https://play.metrix.dpdns.org/bottle.html" />
    <meta property="og:title" content="Spin the Bottle - OpenClassTools" />
    <meta property="og:description" content="Spin the bottle to pick a student and draw a speaking prompt - a classroom icebreaker." />
    <meta property="og:image" content="https://play.metrix.dpdns.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenClassTools" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Spin the Bottle - OpenClassTools" />
    <meta name="twitter:description" content="Spin the bottle to pick a student and draw a speaking prompt - a classroom icebreaker." />
    <meta name="twitter:image" content="https://play.metrix.dpdns.org/og-image.png" />
</head>

<body>
    <canvas id="particles"></canvas>

    <!-- SETUP -->
    <div id="screen-setup" class="screen active">
        <div class="glass-card setup-card">
            <div class="logo-area">
                <span class="logo-icon">🍾</span>
                <h1>Spin the Bottle</h1>
                <p class="tagline">Add players and spin!</p>
            </div>
            <div class="players-input-area">
                <div class="players-list" id="players-list"></div>
                <div class="add-row">
                    <input id="player-input" class="theme-input" type="text" placeholder="Player name…"
                        maxlength="20" />
                    <button id="btn-add" class="btn-accent btn-add-player">+</button>
                </div>
            </div>
            <div class="zebra-toggle-row">
                <label class="toggle-label" for="zebra-toggle">
                    <span class="toggle-icon">🦓</span> Zebra Mode
                    <span class="toggle-hint">(doubles names for more randomness)</span>
                </label>
                <label class="toggle-switch">
                    <input type="checkbox" id="zebra-toggle" />
                    <span class="toggle-slider"></span>
                </label>
            </div>
            <button id="btn-start" class="btn-primary pulse" disabled>
                <span class="btn-text">Start</span>
                <span class="btn-arrow">→</span>
            </button>
            <div class="divider"><span>or</span></div>
            <a href="index.html" class="btn-secondary" style="text-decoration:none;">🏠 Main Menu</a>
        </div>
    </div>

    <!-- GAME -->
    <div id="screen-game" class="screen">
        <div class="game-layout">
            <div class="wheel-wrapper">
                <canvas id="bottle-canvas" width="380" height="380"></canvas>
                <!-- Bottle overlay -->
                <div class="bottle-overlay" id="bottle-overlay">
                    <svg viewBox="0 0 50 160" class="bottle-svg" id="bottle-svg">
                        <defs>
                            <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#c084fc" />
                                <stop offset="50%" stop-color="#a855f7" />
                                <stop offset="100%" stop-color="#7c3aed" />
                            </linearGradient>
                            <linearGradient id="neckGrad" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#d8b4fe" />
                                <stop offset="100%" stop-color="#a855f7" />
                            </linearGradient>
                            <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="rgba(255,255,255,.45)" />
                                <stop offset="100%" stop-color="rgba(255,255,255,0)" />
                            </linearGradient>
                        </defs>
                        <rect x="19" y="0" width="12" height="10" rx="3" fill="#e9d5ff" />
                        <rect x="18" y="10" width="14" height="30" rx="4" fill="url(#neckGrad)" />
                        <path d="M12,40 Q8,45 8,55 L8,120 Q8,135 25,135 Q42,135 42,120 L42,55 Q42,45 38,40 Z"
                            fill="url(#bottleGrad)" />
                        <path d="M16,45 Q14,50 14,58 L14,115 Q14,125 22,128 L22,46 Z" fill="url(#shine)" opacity=".6" />
                        <rect x="12" y="75" width="26" height="18" rx="3" fill="rgba(255,255,255,.12)" />
                        <text x="25" y="88" text-anchor="middle" font-size="8" font-weight="bold"
                            fill="rgba(255,255,255,.5)" font-family="Outfit,sans-serif">🍾</text>
                    </svg>
                </div>
            </div>
            <h2 class="prompt-display" id="prompt-display"></h2>
            <div class="game-controls">
                <button id="btn-spin" class="btn-primary btn-spin-game">
                    <span class="btn-text">Spin!</span>
                </button>
                <button id="btn-shuffle" class="btn-secondary btn-shuffle" title="Shuffle player order">
                    🔀 Shuffle
                </button>
            </div>
            <div class="game-controls-secondary">
                <div class="zebra-toggle-row zebra-toggle-ingame">
                    <label class="toggle-label-sm" for="zebra-toggle-game">
                        <span class="toggle-icon-sm">🦓</span> Zebra
                    </label>
                    <label class="toggle-switch toggle-switch-sm">
                        <input type="checkbox" id="zebra-toggle-game" />
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <a href="index.html" class="btn-secondary btn-ingame-menu"
                    style="text-decoration:none;font-size:.8rem;padding:.45rem 1.2rem;">🏠 Main Menu</a>
            </div>
        </div>
    </div>

    <script src="particles.js"></script>
    <script src="platform-client.js"></script>
    <script src="bottle.js"></script>
</body>

</html>
