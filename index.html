<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Rohirrim Game Hub</title>
    <meta name="description" content="Orta Dünya Ankara topluluk oyunları: Taboo, Who Am I?, Hangman, Millionaire, LingoParty ve online Quiz ile Taboo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="hub.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <script src="i18n.js"></script>
    <script src="shared/legacy-i18n.js"></script>
    <meta name="theme-color" content="#1c2a1c" />
    <link rel="canonical" href="https://games.ortadunyaankara.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rohirrim Game Hub" />
    <meta property="og:url" content="https://games.ortadunyaankara.org/" />
    <meta property="og:title" content="Rohirrim Game Hub" />
    <meta property="og:description" content="Orta Dünya Ankara topluluk oyunları: Taboo, Who Am I?, Hangman, Millionaire, LingoParty ve online Quiz ile Taboo." />
    <meta property="og:image" content="https://games.ortadunyaankara.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Rohirrim Game Hub" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rohirrim Game Hub" />
    <meta name="twitter:description" content="Orta Dünya Ankara topluluk oyunları: Taboo, Who Am I?, Hangman, Millionaire, LingoParty ve online Quiz ile Taboo." />
    <meta name="twitter:image" content="https://games.ortadunyaankara.org/og-image.png" />
</head>

<body>
    <canvas id="particles"></canvas>

    <div class="hub-container">
        <header class="hub-header">
            <div id="language-selector" class="language-selector-wrap"></div>
            <span class="hub-icon emoji">🎮</span>
            <h1>Rohirrim Game Hub</h1>
            <p class="hub-tagline" data-i18n="legacy.hubTagline">Hand-crafted interactive games for classrooms & groups</p>
        </header>

        <div class="category-tabs">
            <button class="cat-tab active" data-filter="all"><span class="tab-emoji emoji">🎮</span> <span data-i18n="legacy.allGames">All Games</span></button>
            <button class="cat-tab" data-filter="solo"><span class="tab-emoji emoji">👤</span> <span data-i18n="legacy.soloGames">Solo Games</span></button>
            <button class="cat-tab" data-filter="multi"><span class="tab-emoji emoji">👥</span> <span data-i18n="legacy.multiplayer">Multiplayer</span></button>
        </div>

        <div class="game-grid">
            <a href="lingoparty.html" class="game-card badge-card" id="card-lingoparty" data-category="multi">
                <span class="card-badge">NEW ✨</span>
                <div class="emoji-wrapper"><span class="game-emoji emoji">🎲</span></div>
                <h2>LingoParty</h2>
            </a>

            <a href="who.html" class="game-card" id="card-who" data-category="multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🎭</span></div>
                <h2>Who Am I?</h2>
            </a>

            <a href="taboo.html" class="game-card" id="card-taboo" data-category="multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🃏</span></div>
                <h2>Taboo</h2>
            </a>

            <a href="hangman.html" class="game-card" id="card-hangman" data-category="solo multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">💀</span></div>
                <h2>Hangman</h2>
            </a>

            <a href="bottle.html" class="game-card" id="card-bottle" data-category="multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🍾</span></div>
                <h2>Spin the Bottle</h2>
            </a>

            <a href="wheel.html" class="game-card" id="card-wheel" data-category="multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🎡</span></div>
                <h2>Wheel of Names</h2>
            </a>

            <a href="kelime.html" class="game-card" id="card-kelime" data-category="solo multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🔤</span></div>
                <h2>Word Game</h2>
            </a>

            <a href="flashcards.html" class="game-card" id="card-flashcards" data-category="solo multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">📇</span></div>
                <h2>Flashcards</h2>
            </a>

            <a href="millionaire.html" class="game-card" id="card-millionaire" data-category="solo multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">💰</span></div>
                <h2>Millionaire</h2>
            </a>

            <a href="hats.html" class="game-card" id="card-hats" data-category="solo multi">
                <div class="emoji-wrapper"><span class="game-emoji emoji">🎩</span></div>
                <h2>6 Thinking Hats</h2>
            </a>

        </div>
    </div>

    <script src="particles.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.cat-tab');
            const cards = document.querySelectorAll('.game-card');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    const filter = tab.getAttribute('data-filter');

                    cards.forEach(card => {
                        const categories = (card.getAttribute('data-category') || '').split(' ');
                        if (filter === 'all' || categories.includes(filter)) {
                            card.classList.remove('hidden');
                        } else {
                            card.classList.add('hidden');
                        }
                    });
                });
            });
        });
    </script>
</body>

</html>
