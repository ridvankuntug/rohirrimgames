<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Word Game - English Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="kelime.css">
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="deck-library.css" />
    <link rel="stylesheet" href="shared/ai-key-prompt.css" />
    <script src="theme.js"></script>
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="description" content="An English word game with AI-generated vocabulary decks." />
    <link rel="canonical" href="https://play.metrix.dpdns.org/kelime.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenClassTools" />
    <meta property="og:url" content="https://play.metrix.dpdns.org/kelime.html" />
    <meta property="og:title" content="Word Game - OpenClassTools" />
    <meta property="og:description" content="An English word game with AI-generated vocabulary decks." />
    <meta property="og:image" content="https://play.metrix.dpdns.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenClassTools" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Word Game - OpenClassTools" />
    <meta name="twitter:description" content="An English word game with AI-generated vocabulary decks." />
    <meta name="twitter:image" content="https://play.metrix.dpdns.org/og-image.png" />
</head>

<body>
    <canvas id="particles"></canvas>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="wordgame-stage">
        <section class="board-surface glass-panel">
            <div class="question-wrap">
                <p id="question-text" class="question-text">Word Game is ready.</p>
            </div>

            <div class="letters-wrap">
                <div id="letters-container" class="letters-container"></div>
            </div>

            <div class="stats-row">
                <div class="stat-card glass-panel">
                    <span class="stat-label">Time</span>
                    <span id="timer-display" class="stat-value timer">04:00</span>
                </div>
                <div class="stat-card glass-panel">
                    <span class="stat-label">Score</span>
                    <span id="score-display" class="stat-value score">0</span>
                </div>
            </div>

            <p id="waiting-msg" class="status-banner glass-panel">Ready for Solo Play! Enter a topic and generate with AI, or click Play Default to start.</p>

            <div class="solo-controls glass-panel">
                <div id="setup-controls" class="solo-top-row">
                    <div id="ai-generate-wrap" style="display:contents">
                        <input type="text" id="theme-input" class="theme-input" placeholder="AI Topic (e.g. Science, Cinema, Space)..." />
                        <button id="btn-generate-ai" class="btn-primary"><span class="btn-icon">✨</span> AI Generate</button>
                    </div>
                    <button id="btn-use-default" class="btn-secondary"><span class="btn-icon">▶️</span> Play / Start</button>
                </div>
                <div id="deck-library-mount"></div>
                <div class="solo-action-bar">
                    <button id="btn-reveal-letter" class="action-btn btn-reveal" title="Reveal 1 random letter (-100 pts)">💡 Harf Al</button>
                    <button id="btn-correct-answer" class="action-btn btn-correct" title="Mark correct & get points">✅ Doğru</button>
                    <button id="btn-pass-question" class="action-btn btn-pass" title="Pass question without points">⏭️ Pas</button>
                    <button id="btn-toggle-timer" class="action-btn btn-timer" title="Pause / Resume Timer">⏸️ Süre</button>
                    <button id="btn-prev-question" class="action-btn btn-nav" title="Previous Question">⬅️ Önceki</button>
                    <button id="btn-next-question" class="action-btn btn-nav" title="Next Question">Sıradaki ➡️</button>
                </div>
            </div>

            <div id="round-result-overlay" class="round-result-overlay" hidden>
                <div class="round-result-card glass-panel">
                    <p id="round-result-kicker" class="round-result-kicker">Round Complete</p>
                    <h2 id="round-result-title" class="round-result-title">Finished</h2>
                    <p id="round-result-message" class="round-result-message">The round is over.</p>
                    <p class="round-result-score-label">Final Score</p>
                    <p id="round-result-score" class="round-result-score">0</p>
                </div>
            </div>
        </section>
    </main>

    <script src="particles.js"></script>
    <script src="shared/generation-console.js"></script>
    <script src="platform-client.js"></script>
    <script src="shared/ai-key-prompt.js"></script>
    <script src="kelime.js"></script>
</body>

</html>
