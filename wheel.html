<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Wheel of Names – OpenClassTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="wheel.css" />
    <link rel="stylesheet" href="theme.css" />
    <script src="theme.js"></script>
    <meta name="theme-color" content="#1c2a1c" />
    <meta name="description" content="Spin a random name wheel to pick students, teams or topics in class." />
    <link rel="canonical" href="https://play.metrix.dpdns.org/wheel.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenClassTools" />
    <meta property="og:url" content="https://play.metrix.dpdns.org/wheel.html" />
    <meta property="og:title" content="Wheel of Names - OpenClassTools" />
    <meta property="og:description" content="Spin a random name wheel to pick students, teams or topics in class." />
    <meta property="og:image" content="https://play.metrix.dpdns.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenClassTools" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wheel of Names - OpenClassTools" />
    <meta name="twitter:description" content="Spin a random name wheel to pick students, teams or topics in class." />
    <meta name="twitter:image" content="https://play.metrix.dpdns.org/og-image.png" />
</head>

<body>
    <canvas id="particles"></canvas>

    <div class="app-layout" id="app">
        <!-- LEFT: Wheel -->
        <div class="wheel-side">
            <div class="wheel-wrapper">
                <div class="wheel-pointer">▼</div>
                <canvas id="wheel-canvas" width="420" height="420"></canvas>
            </div>
            <h2 class="winner-display" id="winner-display"></h2>
            <div class="wheel-actions">
                <button id="btn-spin" class="btn-primary btn-spin" disabled>
                    <span class="btn-text">Spin!</span>
                </button>
                <button id="btn-remove-winner" class="btn-danger" style="display:none;">Remove Winner</button>
            </div>
        </div>

        <!-- RIGHT: Names list -->
        <div class="names-side">
            <div class="glass-card names-card">
                <h2 class="names-heading">Names</h2>
                <div class="names-list-scroll" id="names-list"></div>
                <div class="add-row">
                    <input id="name-input" class="theme-input" type="text" placeholder="Add a name…" maxlength="25" />
                    <button id="btn-add" class="btn-accent btn-add">+</button>
                </div>
                <a href="index.html" class="btn-secondary" style="text-decoration:none;margin-top:.6rem;">🏠 Main
                    Menu</a>
            </div>
        </div>

        <script src="particles.js"></script>
        <script src="platform-client.js"></script>
        <script src="wheel.js"></script>
</body>

</html>
